[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-process-warehouse-validator"
version = "0.1.0"
description = "Local warehouse receiving data validation (CSV, PDF, image)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
documents = ["pypdf>=5,<7", "pypdfium2>=4,<6", "Pillow>=11,<13", "pytesseract>=0.3.13,<1"]

[tool.setuptools.packages.find]
include = ["warehouse_validator*"]
